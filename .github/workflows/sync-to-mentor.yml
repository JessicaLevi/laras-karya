name: Sync feature to Mentor Feature

on:
  push:
    branches:
      - feature

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature
          persist-credentials: false

      - name: Check token is set
        env:
          MENTOR_REPO_TOKEN: ${{ secrets.MENTOR_REPO_TOKEN }}
        run: |
          if [ -z "${MENTOR_REPO_TOKEN}" ]; then
            echo "MENTOR_REPO_TOKEN is empty"
            exit 1
          fi
          echo "Token is set"

      - name: Push to mentor feature branch
        env:
          MENTOR_REPO_TOKEN: ${{ secrets.MENTOR_REPO_TOKEN }}
        run: |
          git push "https://x-access-token:${MENTOR_REPO_TOKEN}@github.com/blacurly/ratu-zaleha.git" HEAD:feature --force
