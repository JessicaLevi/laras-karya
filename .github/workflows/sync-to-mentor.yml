name: Sync to Mentor Repo

on:
  push:
    branches:
      - feature  # Berjalan otomatis setiap ada push ke branch feature tim Anda

jobs:
  git-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Mentor Repo
        run: |
          git remote add mentor https://${{ secrets.MENTOR_REPO_TOKEN }}@github.com/blacurly/ratu-zaleha
          git push mentor feature:main --force

